
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- EDIT 1: The text shown in the browser tab -->
  <title>My Presentation - Download</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
      color: #222;
    }
    h1 { font-size: 28px; }
    .note { color: #555; }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #0366d6;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 18px;
    }
    .button:hover { background: #024ea2; }
  </style>
</head>
<body>

  <!-- EDIT 2: Your presentation title -->
  <h1>My Presentation Title</h1>

  <!-- EDIT 3: A short subtitle (optional) -->
  <p>Subtitle or your name goes here</p>

  <p class="note">The presentation file is available for download below.</p>

  <!-- EDIT 4: The file name in href, and the name it will be saved as in download -->
  <a class="button" href="presentation.pptx" download="presentation.pptx">Download PPT</a>

  <!-- EDIT 5: The file name shown on the page (optional) -->
  <p class="note">File: korea-zinc-case.pptx</p>

</body>
</html>
